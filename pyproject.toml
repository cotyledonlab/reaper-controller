[project]
name = "reaper-controller"
version = "0.1.0"
description = "Agentic connector for REAPER DAW: Lua bridge daemon + OSC + files. Engineer + session-player personas, no computer-use."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "reaper-controller" }]
keywords = ["reaper", "daw", "reascript", "osc", "midi", "agents", "mcp", "audio"]

dependencies = []

[project.optional-dependencies]
midi = ["mido>=1.3", "python-rtmidi>=1.5"]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest>=8", "mido>=1.3", "python-rtmidi>=1.5", "mcp>=1.0,<2"]

[project.scripts]
reaper-connector = "reaper_connector.__main__:cli_main"
reaper-connector-server = "reaper_connector.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reaper_connector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
